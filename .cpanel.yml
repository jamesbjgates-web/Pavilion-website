---
deployment:
  tasks:
    - export DEPLOYPATH=/home/pspt/public_html/
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp styles.css $DEPLOYPATH
    - /bin/cp script.js $DEPLOYPATH
    - /bin/cp prospect-intelligence.html $DEPLOYPATH
    - /bin/cp tender-intelligence.html $DEPLOYPATH
    - /bin/cp dispute-support.html $DEPLOYPATH
    - /bin/cp payment-recovery.html $DEPLOYPATH
    - /bin/cp payment-administration.html $DEPLOYPATH
    - /bin/cp fees.html $DEPLOYPATH
    - /bin/cp about.html $DEPLOYPATH
    - /bin/cp contact.html $DEPLOYPATH
    - /bin/cp privacy.html $DEPLOYPATH
    - /bin/cp terms.html $DEPLOYPATH
    - /bin/cp contact-handler.php $DEPLOYPATH
    - /bin/cp thank-you.html $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R downloads $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp sitemap.xml $DEPLOYPATH

    # V7 PRIVATE PREVIEW - separate subdirectory; does not replace production files
    - /bin/mkdir -p ${DEPLOYPATH}v7-preview/
    - /bin/mkdir -p ${DEPLOYPATH}v7-preview/assets/
    - /bin/mkdir -p ${DEPLOYPATH}v7-preview/downloads/
    - /bin/cp v7-preview/index.html ${DEPLOYPATH}v7-preview/index.html
    - /bin/cp v7-preview/styles-v7.css ${DEPLOYPATH}v7-preview/styles-v7.css
    - /bin/cp v7-preview/assets/pavilion-logo-transparent.png ${DEPLOYPATH}v7-preview/assets/pavilion-logo-transparent.png
    - /bin/cp v7-preview/downloads/Pavilion_Tender_Intelligence_Example_Report_Fictional.pdf ${DEPLOYPATH}v7-preview/downloads/Pavilion_Tender_Intelligence_Example_Report_Fictional.pdf
